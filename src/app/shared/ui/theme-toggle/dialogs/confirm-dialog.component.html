<div class="dialog-container">
  <h2>{{ data.title }}</h2>
  <p>{{ data.message }}</p>

  <div class="actions">
    <button type="button" mat-button (click)="cancel()">{{ 'common.cancel' | translate }}</button>
    <button type="button" mat-button color="warn" (click)="confirm()">
      {{ 'common.confirm' | translate }}
    </button>
  </div>
</div>
