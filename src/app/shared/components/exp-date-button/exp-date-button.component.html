<mat-form-field class="hidden-date-field">
  <input
    matInput
    [matDatepicker]="datepicker"
    [value]="value"
    (dateChange)="onDateChange($event)"
  />
</mat-form-field>
<mat-datepicker #datepicker></mat-datepicker>

<button
  mat-icon-button
  type="button"
  (click)="openPicker()"
  class="calendar-fab"
  aria-label="Change date"
>
  <mat-icon>calendar_today</mat-icon>
</button>
