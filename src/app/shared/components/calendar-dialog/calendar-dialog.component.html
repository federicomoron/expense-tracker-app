<div class="calendar-dialog">
  <button
    type="button"
    mat-icon-button
    aria-label="register.back"
    class="register-back"
    (click)="close()"
  >
    <mat-icon>arrow_back</mat-icon>
  </button>

  <mat-calendar
    [(selected)]="selectedDate"
    [startAt]="selectedDate"
    [dateFilter]="isDateValid"
    (selectedChange)="onDateSelected($event)"
  ></mat-calendar>
</div>
