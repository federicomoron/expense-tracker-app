<button
  mat-raised-button
  [type]="type"
  [color]="color"
  [disabled]="isLoading || disabled"
  [class.full-width]="fullWidth"
>
  @if (isLoading) {
    <mat-progress-spinner
      mode="indeterminate"
      diameter="20"
      color="accent"
      class="spinner"
    ></mat-progress-spinner>
  } @else {
    <ng-content></ng-content>
  }
</button>
