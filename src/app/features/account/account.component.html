<div class="account-container">
  <div class="account-panel">
    <div class="account-header">
      <div class="account-avatar">
        <img src="/assets/spendly.png" alt="Avatar" />
      </div>

      <div class="account-header-info">
        <div class="account-name">{{ auth.currentUser()?.name || 'Your Name' }}</div>
        <div class="account-email">{{ auth.currentUser()?.email }}</div>
      </div>
    </div>

    <mat-divider class="account-divider"></mat-divider>

    @if (claimableGuests().length > 0) {
      <div class="claimable-guests">
        <h3>{{ 'account.claimableGuestsTitle' | translate }}</h3>
        @for (guest of claimableGuests(); track guest.userId) {
          <div class="claimable-guest-row">
            <span class="claimable-guest-name">{{ guest.name }}</span>
            <button
              type="button"
              mat-stroked-button
              color="primary"
              [disabled]="claimingUserId() === guest.userId"
              (click)="claimGuest(guest.userId)"
            >
              {{ 'account.claim' | translate }}
            </button>
          </div>
        }
      </div>
      <mat-divider class="account-divider"></mat-divider>
    }

    <div class="lang-container">
      <button type="button" (click)="toggleLang()" class="lang-toggle" aria-label="Change language">
        <img
          src="/assets/es.png"
          alt="Español"
          class="lang-flag"
          [class.active]="currentLang === 'es'"
        />
        <img
          src="/assets/gb.png"
          alt="English"
          class="lang-flag"
          [class.active]="currentLang === 'en'"
        />
      </button>
    </div>

    <theme-toggle></theme-toggle>

    <div class="pwa-button">
      <app-pwa-install-button />
    </div>

    <div class="account-list">
      <button type="button" class="logout-button" (click)="logout()" aria-label="Logout">
        <mat-icon>logout</mat-icon>
        <span>{{ 'account.logout' | translate }}</span>
      </button>
    </div>
  </div>
</div>
