<footer class="app-footer">
  @if (calendarOnly) {
    <nav class="footer-nav">
      <button type="button" (click)="openCalendar()">
        <mat-icon>calendar_today</mat-icon>
        <span>{{ 'footer.date' | translate }}</span>
      </button>

      <input
        [matDatepicker]="picker"
        [value]="date"
        (dateChange)="onDateSelected($event.value)"
        hidden
      />
      <mat-datepicker #picker></mat-datepicker>
    </nav>
  } @else if (!isExpenseForm) {
    <nav class="footer-nav">
      <button type="button" (click)="goTo('/account')" [class.active]="isActive('/account')">
        <mat-icon>person</mat-icon>
        <span>{{ 'footer.account' | translate }}</span>
      </button>

      <button type="button" (click)="goTo('/groups')" [class.active]="isActive('/groups')">
        <mat-icon>group</mat-icon>
        <span>{{ 'footer.groups' | translate }}</span>
      </button>

      <!-- Botón para historial si se decide habilitar más adelante -->
      <!--
      <button type="button" (click)="goTo('/activity')" [class.active]="isActive('/activity')">
        <mat-icon>history</mat-icon>
        <span>{{ 'footer.activity' | translate }}</span>
      </button>
      -->
    </nav>
  } @else {
    <div class="footer-actions">
      <button
        type="button"
        mat-fab
        color="primary"
        [attr.aria-label]="'footer.calendar' | translate"
      >
        <mat-icon>calendar_today</mat-icon>
      </button>
      <button type="button" mat-fab color="accent" [attr.aria-label]="'footer.add' | translate">
        <mat-icon>add</mat-icon>
      </button>
    </div>
  }
</footer>
