<div class="dialog-container">
  <app-header
    [title]="'splitTypeDialog.title' | translate"
    [showBack]="true"
    (back)="closeDialog()"
  ></app-header>

  <mat-nav-list>
    @for (option of options; track option) {
      <mat-list-item (click)="choose(option)">
        <span class="option-name">{{ option }}</span>
      </mat-list-item>
    }
  </mat-nav-list>
</div>
