<div class="dialog-container">
  <app-header
    [title]="'paidByQuickDialog.title' | translate"
    [showBack]="true"
    (back)="closeDialog()"
  ></app-header>

  <mat-nav-list>
    @for (option of options(); track option.id) {
      @let isSelected = _selectedOption()?.id === option.id;
      <mat-list-item (click)="selectOption(option)" [class.selected]="isSelected">
        <span class="option-label">{{ option.label | translate }}</span>
        @if (isSelected) {
          ✓
        }
      </mat-list-item>
    }
  </mat-nav-list>

  <!-- <div class="more-options">
    <button mat-stroked-button color="primary" (click)="openMoreOptions()">
      {{ 'paidByQuickDialog.moreOptions' | translate }}
    </button>
  </div> -->
</div>
