<div class="dialog-container">
  <div class="header">
    <button type="button" mat-icon-button aria-label="paidByDialog.back" (click)="closeDialog()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h2>{{ 'paidByQuickDialog.title' | translate }}</h2>
  </div>

  <mat-nav-list>
    @for (option of options(); track option.id) {
      @let isSelected = _selectedOption()?.id === option.id;
      <mat-list-item (click)="selectOption(option)" [class.selected]="isSelected">
        <span class="option-label">{{ option.label | translate }}</span>
        @if (isSelected) {
          ✓
        }
      </mat-list-item>
    }
  </mat-nav-list>

  <!-- <div class="more-options">
    <button mat-stroked-button color="primary" (click)="openMoreOptions()">
      {{ 'paidByQuickDialog.moreOptions' | translate }}
    </button>
  </div> -->
</div>
