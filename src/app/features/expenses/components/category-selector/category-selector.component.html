<div class="dialog-container">
  <div class="header">
    <button mat-icon-button aria-label="Close category selector" (click)="closeDialog()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h2>Select Category</h2>
  </div>

  <mat-nav-list>
    @for (category of categories(); track category.key) {
      <mat-list-item
        (click)="chooseCategory(category.key)"
        [class.selected]="selectedCategory() === category.key"
      >
        <span class="option-name">{{ category.label }}</span>
      </mat-list-item>
    }
  </mat-nav-list>
</div>
