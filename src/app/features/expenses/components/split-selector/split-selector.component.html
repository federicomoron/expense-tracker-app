<div class="selector-buttons">
  @if (groupMembers && groupMembers.length > 0) {
    <button
      type="button"
      class="selector-button"
      (click)="openPaidByDialog()"
      aria-label="splitSelector.paidBy"
    >
      <mat-icon>person</mat-icon>
      <span
        >{{ 'splitSelector.paidBy' | translate }}:
        {{ selectedPayer()?.name || ('splitSelector.select' | translate) }}</span
      >
    </button>

    <!--
    <button type="button" class="selector-button" (click)="openSplitTypeDialog()" aria-label="splitSelector.splitType">
      <mat-icon>call_split</mat-icon>
      <span>{{ 'splitSelector.split' | translate }}: {{ selectedSplitType() || ('splitSelector.select' | translate) }}</span>
    </button>
    -->
  }
</div>
