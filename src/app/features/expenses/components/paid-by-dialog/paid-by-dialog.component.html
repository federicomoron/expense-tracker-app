<div class="dialog-container">
  <app-header
    [title]="'paidByDialog.title' | translate"
    [showBack]="true"
    (back)="closeDialog()"
  ></app-header>

  <mat-nav-list>
    @for (member of members(); track member.userId) {
      <mat-list-item
        (click)="choose(member)"
        [class.selected]="selected()?.userId === member.userId"
      >
        <span class="member-name">
          {{ member.name }}
          @if (member.isGuest) {
            <span class="guest-badge">{{ 'groupActions.guestBadge' | translate }}</span>
          }
        </span>
      </mat-list-item>
    }
  </mat-nav-list>
</div>
