<div class="dialog-container">
  <div class="header">
    <button type="button" mat-icon-button aria-label="paidByDialog.back" (click)="closeDialog()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h2>{{ 'paidByDialog.title' | translate }}</h2>
  </div>

  <mat-nav-list>
    @for (member of members(); track member.userId) {
      <mat-list-item
        (click)="choose(member)"
        [class.selected]="selected()?.userId === member.userId"
      >
        <span class="member-name">{{ member.name }}</span>
      </mat-list-item>
    }
  </mat-nav-list>
</div>
