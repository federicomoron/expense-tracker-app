<div class="expense-screen">
  <div class="expense-header-wrapper">
    <mat-toolbar color="primary" class="expense-form-toolbar">
      <button mat-icon-button (click)="goBack()" aria-label="Back">
        <mat-icon>arrow_back</mat-icon>
      </button>

      <span class="toolbar-title">Add Expense</span>

      <span class="spacer"></span>

      <button
        mat-icon-button
        (click)="submitExpense()"
        [disabled]="expenseForm.invalid || isSubmitting"
        aria-label="Save"
      >
        <mat-icon>check</mat-icon>
      </button>
    </mat-toolbar>
  </div>

  <form [formGroup]="expenseForm" class="expense-form" (ngSubmit)="submitExpense()">
    <div class="field-row">
      <button type="button" class="icon-button" (click)="openCategorySelector()">
        @if (selectedCategoryIcon) {
          <img [src]="selectedCategoryIcon" alt="Category Icon" width="24" height="24" />
        } @else {
          <mat-icon>receipt</mat-icon>
        }
      </button>

      <input
        type="text"
        formControlName="description"
        class="flat-input full-width"
        placeholder="Enter a description"
      />
    </div>

    <div class="field-row">
      <button type="button" class="icon-button" (click)="openCurrencySelector()">
        <span class="currency-label">{{ expenseForm.value.currency || '$' }}</span>
      </button>

      <input
        type="number"
        inputmode="numeric"
        formControlName="total"
        class="flat-input full-width"
        placeholder="0.00"
      />
    </div>

    <app-split-selector [groupMembers]="group?.members || []"></app-split-selector>

    <app-exp-date-button
      #dateButton
      [value]="expenseForm.value.date"
      (valueChange)="expenseForm.get('date')?.setValue($event)"
    ></app-exp-date-button>
  </form>

  <app-footer [calendarOnly]="true" (calendarClick)="openDateSelector()"></app-footer>
</div>
