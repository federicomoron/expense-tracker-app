<div class="expense-screen">
  <mat-toolbar color="primary" class="expense-form-toolbar">
    <button type="button" mat-icon-button (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <span class="toolbar-title">{{ 'expenseForm.title' | translate }}</span>
    <span class="spacer"></span>
    <button
      mat-icon-button
      [disabled]="expenseForm.invalid || isSubmitting"
      (click)="submitExpense()"
    >
      @if (isSubmitting) {
        <mat-progress-spinner
          diameter="24"
          mode="indeterminate"
          class="custom-spinner-white"
        ></mat-progress-spinner>
      } @else {
        <mat-icon>check</mat-icon>
      }
    </button>
  </mat-toolbar>

  @if (group) {
    <form [formGroup]="expenseForm" class="expense-form" (ngSubmit)="submitExpense()">
      <div class="field-row">
        <button type="button" class="icon-button" (click)="openCategorySelector()">
          @if (selectedCategoryIcon) {
            <img [src]="selectedCategoryIcon" alt="Category Icon" width="24" height="24" />
          } @else {
            <mat-icon>receipt</mat-icon>
          }
        </button>
        <input
          type="text"
          formControlName="description"
          class="flat-input full-width"
          [placeholder]="'expenseForm.descriptionPlaceholder' | translate"
        />
      </div>

      <div class="field-row">
        <button type="button" class="icon-button" (click)="openCurrencySelector()">
          <span class="currency-label">{{ expenseForm.value.currency || '$' }}</span>
        </button>
        <input
          type="number"
          inputmode="numeric"
          formControlName="total"
          class="flat-input full-width"
          placeholder="0.00"
        />
      </div>

      <app-split-selector
        [groupMembers]="group.members"
        [selectedOptionId]="selectedOptionIdForSplit"
      ></app-split-selector>
    </form>

    <app-footer
      [calendarOnly]="true"
      [date]="expenseCreatedAtForFooter"
      (dateChange)="setExpenseDate($event)"
    ></app-footer>
  } @else {
    <div class="loading-spinner"><div class="custom-spinner"></div></div>
  }
</div>
