<div class="group-form-wrapper">
  <h2 class="form-title">Create a new group</h2>
  <form (submit)="onSubmit($event)" class="group-form" autocomplete="off">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Group Name</mat-label>
      <mat-icon matPrefix>group</mat-icon>
      <input
        matInput
        [value]="name()"
        (input)="onNameInput($event)"
        placeholder="e.g. Friends Trip"
      />
      @if (isNameInvalid()) {
        <mat-error>The name is required</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Group Type</mat-label>
      <mat-icon matPrefix>category</mat-icon>
      <mat-select [value]="type()" (selectionChange)="onTypeChange($event)">
        @for (option of groupTypeOptions; track option.value) {
          <mat-option [value]="option.value">{{ option.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <div class="button-row">
      <button mat-button type="button" (click)="onCancel()">Cancel</button>

      <button mat-flat-button color="primary" type="submit" [disabled]="isNameInvalid()">
        Create
      </button>
    </div>
  </form>
</div>
