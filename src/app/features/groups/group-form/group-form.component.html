<div class="group-screen">
  <div class="main-content-bg">
    <mat-toolbar color="primary" class="group-form-toolbar">
      <button
        type="button"
        mat-icon-button
        (click)="onCancel()"
        [attr.aria-label]="'groupForm.back' | translate"
      >
        <mat-icon>arrow_back</mat-icon>
      </button>

      <span class="toolbar-title">{{ 'groupForm.title' | translate }}</span>

      <span class="spacer"></span>

      <button
        type="button"
        mat-icon-button
        (click)="onSubmit($event)"
        [disabled]="isNameInvalid()"
        [attr.aria-label]="'groupForm.save' | translate"
      >
        <mat-icon>check</mat-icon>
      </button>
    </mat-toolbar>
  </div>

  <form (submit)="onSubmit($event)" class="group-form" autocomplete="off">
    <div class="field-row">
      <button type="button" class="icon-button" disabled>
        <mat-icon>group</mat-icon>
      </button>

      <input
        type="text"
        [value]="name()"
        (input)="onNameInput($event)"
        class="flat-input full-width"
        [placeholder]="'groupForm.namePlaceholder' | translate"
      />
    </div>

    <div class="field-row">
      <button type="button" class="icon-button" disabled>
        <mat-icon>category</mat-icon>
      </button>

      <mat-form-field appearance="fill" class="flat-select full-width">
        <mat-select [value]="type()" (selectionChange)="onTypeChange($event)">
          @for (option of groupTypeOptions; track option.value) {
            <mat-option [value]="option.value">{{ option.label | translate }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
  </form>
</div>
