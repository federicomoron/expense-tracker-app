<div class="dialog-container">
  <!-- Header -->
  <div class="header">
    <button type="button" mat-icon-button aria-label="back" (click)="close()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h2>{{ 'groupActions.title' | translate }}</h2>
  </div>

  <!-- New Members Section -->
  <div class="group-members">
    <button type="button" mat-stroked-button color="primary" (click)="openAddMemberDialog()">
      <mat-icon>person_add</mat-icon>
      {{ 'groupActions.addMember' | translate }}
    </button>

    <h3>{{ 'groupActions.members' | translate }}</h3>
    <mat-list>
      @for (member of members(); track member.invitedUserId ?? member.email) {
        <mat-list-item>
          <div class="member-info">
            <span class="member-name">{{ member.name }}</span>
            <span class="member-email">{{ member.email }}</span>

            @if (member.status === 'pending') {
              <span class="pending-label">Pendiente</span>
            }
          </div>
        </mat-list-item>
      }
    </mat-list>
  </div>

  <!-- Modal content -->
  <div class="group-actions-list">
    <button type="button" class="delete-group-button" (click)="confirmDeleteGroup()">
      <mat-icon>delete</mat-icon>
      <span>{{ 'groupActions.delete' | translate }}</span>
    </button>
  </div>
</div>
